name: Test build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          path: repo

      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - uses: actions/cache@v3
        with:
          path: |
            repo/lwip2-src
            esp8266/tools/dist
          key: ${{ runner.os }}-make-${{ hashFiles('repo/Makefile', 'repo/makefiles/**/*', 'repo/CMakeLists.txt', 'repo/cmake/**/*') }}

      - name: Fetch ESP8266 Core
        uses: actions/checkout@v3
        with:
          path: esp8266
          repository: esp8266/Arduino
          fetch-depth: 1
          submodules: false

      - name: Get toolchain files
        run: |
          pushd esp8266/tools
          python get.py --quiet --tool xtensa-lx106-elf
          popd

      - name: Build w/ gmake
        env:
          ESP8266_ARDUINO_CORE_DIR: ${{ github.workspace }}/esp8266
        run: |
          export PREFIX="${ESP8266_ARDUINO_CORE_DIR}"
          export PATH="${ESP8266_ARDUINO_CORE_DIR}/tools/xtensa-lx106-elf/bin/:${PATH}"

          pushd repo

          gmake lwip
          gmake -j$(nproc) install

          popd

      - name: Build w/ CMake
        env:
          ESP8266_ARDUINO_CORE_DIR: ${{ github.workspace }}/esp8266
        run: |
          cmake \
             --toolchain=${{ github.workspace }}/repo/cmake/toolchain-esp8266.cmake \
            -DCMAKE_PROGRAM_PATH=${ESP8266_ARDUINO_CORE_DIR}/tools/xtensa-lx106-elf/bin \
            -DESP8266_ARDUINO_CORE_DIR=${ESP8266_ARDUINO_CORE_DIR} \
            -S repo \
            -B build
          cmake --build build/ --parallel $(nproc)
